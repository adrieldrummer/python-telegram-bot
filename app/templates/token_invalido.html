{% extends "base.html" %}
{% block titulo %}{{ titulo }} — {{ config.app_nome }}{% endblock %}

    <a class="marca" href="/"><img src="/static/img/emblema.png" alt=""><span>MAPA DA <b>APROVAÇÃO</b></span></a>

      <div style="font-size:2.5rem">⏳</div>
      <h1 style="font-size:1.35rem">{{ titulo }}</h1>
      <p class="suave">{{ mensagem }}</p>

</div>
{% endblock %}
