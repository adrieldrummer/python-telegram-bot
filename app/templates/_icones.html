{# Ícones em SVG inline.

   Inline porque cada requisição a mais custa caro em 4G: um sprite externo
   atrasaria justamente a navegação que o aluno usa o tempo todo. Todos herdam
   a cor do texto (`currentColor`), então basta trocar a cor do link. #}

{% macro icone(nome) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if nome == 'inicio' -%}
  <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/>
{%- elif nome == 'trilha' -%}
  <path d="M4 6h7"/><path d="M13 12h7"/><path d="M4 18h7"/>
  <circle cx="17" cy="6" r="2.2"/><circle cx="7" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/>
{%- elif nome == 'questoes' -%}
  <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/>
{%- elif nome == 'erros' -%}
  <path d="M5 4.5h11.5a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z"/><path d="M5 17.5h13.5"/>
  <path d="M9 8.5h6"/><path d="M9 12h4"/>
{%- elif nome == 'simulados' -%}
  <circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.3 1.6"/><path d="M9.5 2.5h5"/>
{%- elif nome == 'modulos' -%}
  <path d="M12 3.5 21 8l-9 4.5L3 8z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 16.8 12 21.3l9-4.5"/>
{%- elif nome == 'apostila' -%}
  <path d="M4 5a2 2 0 0 1 2-2h4.5v18H6a2 2 0 0 1-2-2z"/><path d="M20 5a2 2 0 0 0-2-2h-4.5v18H18a2 2 0 0 0 2-2z"/>
{%- elif nome == 'pontos' -%}
  <path d="m12 3.5 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 10l6.1-.9z"/>
{%- elif nome == 'conta' -%}
  <circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/>
{%- elif nome == 'admin' -%}
  <path d="M12 3 5 6v6c0 4.2 2.8 7.6 7 9 4.2-1.4 7-4.8 7-9V6z"/><path d="m9.2 12 2 2 3.6-3.8"/>
{%- elif nome == 'planos' -%}
  <path d="M3.5 8.5h17v10a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 12.5h17"/>
  <path d="M8 8.5V6a2.5 2.5 0 0 1 5 0v2.5"/>
{%- elif nome == 'mais' -%}
  <circle cx="6.5" cy="6.5" r="2.3"/><circle cx="12" cy="6.5" r="2.3"/><circle cx="17.5" cy="6.5" r="2.3"/>
  <circle cx="6.5" cy="12" r="2.3"/><circle cx="12" cy="12" r="2.3"/><circle cx="17.5" cy="12" r="2.3"/>
  <circle cx="6.5" cy="17.5" r="2.3"/><circle cx="12" cy="17.5" r="2.3"/><circle cx="17.5" cy="17.5" r="2.3"/>
{%- elif nome == 'sino' -%}
  <path d="M18 9a6 6 0 1 0-12 0c0 4.4-1.4 6-2 6.6h16c-.6-.6-2-2.2-2-6.6"/>
  <path d="M10.2 19a2 2 0 0 0 3.6 0"/>
{%- elif nome == 'sair' -%}
  <path d="M9.5 4.5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3.5"/><path d="M14 12h6.5"/><path d="m17.5 8.8 3.2 3.2-3.2 3.2"/>
{%- endif -%}
</svg>
{%- endmacro %}
