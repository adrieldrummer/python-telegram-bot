# Sobe a plataforma com HTTPS automático (Caddy resolve o certificado).
#   cd deploy && docker compose up -d
services:
  plataforma:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - dados:/dados
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - plataforma

  lembretes:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - dados:/dados
    entrypoint: ["/bin/sh", "-c"]
    # roda a rotina de lembretes uma vez por hora; o script só envia para quem falta
    command: ["while true; do python scripts/enviar_lembretes.py; sleep 3600; done"]

volumes:
  dados:
  caddy_data:
  caddy_config:
